name: Sync to Hugging Face

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Clone o Space vazio ou existente
          git clone https://meme5y:$HF_TOKEN@huggingface.co/spaces/meme5y/Boston-Aerospace-AI1 temp_space || true
          cd temp_space || exit 1

          # Se o Space estiver vazio, cria um README para iniciar
          if [ -z "$(ls -A)" ]; then
            echo "# Boston Aerospace AI" > README.md
            git add README.md
            git commit -m "Inicializa Space"
            git push https://meme5y:$HF_TOKEN@huggingface.co/spaces/meme5y/Boston-Aerospace-AI1 main
          fi

          # Volta para o diretório principal e sincroniza tudo
          cd ..
          git remote add hf https://meme5y:$HF_TOKEN@huggingface.co/spaces/meme5y/Boston-Aerospace-AI1
          git push -f hf main
