app = "boston-aerospace-ai"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "5000"

[services]
  internal_port = 5000
  protocol = "tcp"

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.healthchecks]
    interval = "15s"
    timeout = "10s"
    grace_period = "30s"

[metrics]
  port = 5000
  path = "/metrics"